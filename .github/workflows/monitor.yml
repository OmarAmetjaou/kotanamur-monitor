name: Check Kotanamur listings

on:
  schedule:
    # Temporary 5-minute schedule to verify automatic triggering. Times are UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kotanamur-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download monitor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check listings and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_TIMEOUT_SECONDS: "25"
          REQUEST_DELAY_SECONDS: "0.75"
          MAX_PAGES_PER_SEARCH: "10"
        run: python monitor.py

      - name: Save listing state
        shell: bash
        run: |
          mkdir -p data
          printf '%s\n' "$(date -u +%Y-%m)" > data/heartbeat-month.txt
          git add -f data/state.json data/heartbeat-month.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update monitor state [skip ci]"
          git push
